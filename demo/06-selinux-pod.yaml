# Step 6: Run a pod with the SELinux profile applied
#
# Requires: SelinuxProfile in Installed state (step 5)
#
# The pod uses the SELinux type generated by SPO. The type name is
# shown in the SelinuxProfile USAGE column (e.g., demo-errorlogger.process).
#
# Usage:
#   # First check the usage type:
#   oc get selinuxprofile demo-errorlogger -n spo-demo -o jsonpath='{.status.usage}'
#   # Output: demo-errorlogger.process
#
#   oc apply -f 06-selinux-pod.yaml
#
# Verify the pod is running:
#   oc get pod demo-selinux-pod -n spo-demo
#
# Confirm SELinux context:
#   oc exec demo-selinux-pod -n spo-demo -- id -Z 2>/dev/null || \
#     oc exec demo-selinux-pod -n spo-demo -- cat /proc/1/attr/current
#
# Cleanup when done:
#   oc delete -f 06-selinux-pod.yaml
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-selinux-pod
  namespace: spo-demo
spec:
  securityContext:
    runAsUser: 1000
    seLinuxOptions:
      type: demo-errorlogger.process
  containers:
  - name: test
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command: ["sleep", "infinity"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
