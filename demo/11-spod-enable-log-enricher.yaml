# Step 11 (optional): Enable the classic Log Enricher (auditd-based)
#
# The log enricher reads audit events from auditd and enriches them with
# Kubernetes metadata (node, namespace, pod, container, executable).
#
# Unlike the JSON enricher (step 8) which uses eBPF and groups syscalls
# per process at intervals, the log enricher emits one line per syscall
# event as they come from the kernel audit subsystem.
#
# The source can be switched between "auditd" (default) and "bpf" using
# the logEnricherSource field.
#
# Usage:
#   oc patch spod spod -n openshift-security-profiles \
#     --type=merge --patch-file=11-spod-enable-log-enricher.yaml
#
# Wait for SPOD to become RUNNING with 4/4 containers per pod (~90 seconds):
#   watch "oc get spod spod -n openshift-security-profiles && echo '---' && \
#     oc get pods -n openshift-security-profiles -l name=spod"
#   (4 containers: security-profiles-operator + selinuxd + json-enricher + log-enricher)
#
# After enabling, deploy a workload (e.g. step 9) and check the logs:
#   SPOD_POD=$(oc get pods -n openshift-security-profiles -l name=spod \
#     -o jsonpath='{.items[0].metadata.name}')
#   oc logs $SPOD_POD -n openshift-security-profiles -c log-enricher --tail=10
---
apiVersion: security-profiles-operator.x-k8s.io/v1alpha1
kind: SecurityProfilesOperatorDaemon
metadata:
  name: spod
  namespace: openshift-security-profiles
spec:
  enableLogEnricher: true
  logEnricherSource: auditd
